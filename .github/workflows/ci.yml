name: firstrefusal-ci

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install pinned GenLayer CLI
        run: npm install
      - name: Prepare pinned GenVM runtime
        env:
          GENVM_BUNDLE_URL: https://github.com/genlayerlabs/genvm-manager/releases/download/v0.6.0-rc8/genvm-universal.tar.xz
          GENVM_BUNDLE_SHA256: bd30580f911338d5533460eca8ed714dec371de5803c04e41dbb96430aea7b6e
        run: |
          mkdir -p "$RUNNER_TEMP/genvm-tree" "$HOME/.cache/gltest-direct" "$HOME/.cache/genvm-linter"
          curl --fail --location --retry 3 "$GENVM_BUNDLE_URL" --output "$RUNNER_TEMP/genvm-universal.tar.xz"
          echo "$GENVM_BUNDLE_SHA256  $RUNNER_TEMP/genvm-universal.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/genvm-universal.tar.xz" -C "$RUNNER_TEMP/genvm-tree"
          python scripts/prepare_legacy_genvm.py \
            --tree "$RUNNER_TEMP/genvm-tree" \
            --contract contracts/firstrefusal.py \
            --output "$HOME/.cache/gltest-direct/genvm-universal-v0.6.0-rc8.tar.xz"
          cp "$HOME/.cache/gltest-direct/genvm-universal-v0.6.0-rc8.tar.xz" \
            "$HOME/.cache/genvm-linter/genvm-universal-v0.6.0-rc8.tar.xz"
      - name: Verify CLI pin
        run: |
          test "$(npx --no-install genlayer --version | tr -d '\r')" != ""
          node -e "const p=require('./node_modules/genlayer/package.json'); if(p.version!=='0.39.1') process.exit(1); console.log(p.version)"
      - name: Preflight
        run: python scripts/preflight.py
      - name: GenVM lint
        run: |
          genvm-lint check contracts/firstrefusal.py
          genvm-lint check contracts/protected_transfer.py
      - name: Direct Mode
        run: pytest tests/direct -v
      - name: Compile integration harness
        run: python -m py_compile tests/integration/test_studionet_lifecycle.py
      - name: Manifest
        run: python scripts/make_manifest.py
