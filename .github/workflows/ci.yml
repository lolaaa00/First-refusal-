name: firstrefusal-ci

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install pinned GenLayer CLI
        run: npm install
      - name: Verify CLI pin
        run: |
          test "$(npx --no-install genlayer --version | tr -d '\r')" != ""
          node -e "const p=require('./node_modules/genlayer/package.json'); if(p.version!=='0.39.1') process.exit(1); console.log(p.version)"
      - name: Preflight
        run: python scripts/preflight.py
      - name: GenVM lint
        run: |
          genvm-lint check contracts/firstrefusal.py
          genvm-lint check contracts/protected_transfer.py
      - name: Direct Mode
        run: pytest tests/direct -v
      - name: Compile integration harness
        run: python -m py_compile tests/integration/test_studionet_lifecycle.py
      - name: Manifest
        run: python scripts/make_manifest.py
